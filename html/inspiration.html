<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding - Inspiration</title>
    <link rel="icon" type="image/png" href="/images/icons8-wedding-day-50.png">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="container">
        <h1>Stuart & Lucy</h1>
        <p style="font-style: italic; color: #666; font-size: 1.2em;">Are Getting Married!</p>

        <div id="nav"></div>
        <script>
            fetch("./nav.html")
                .then(response => response.text())
                .then(html => {
                    document.getElementById("nav").innerHTML = html;
                });
        </script>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">

        <h2>Inspiration Gallery</h2>
        <p>A collection of ideas and mood boards for our big day. Click any photo to view full size!</p>

        <!-- Gallery Grid -->
        <div class="gallery">
            <img src="/images/photo1.jpg" alt="Inspiration 1" class="gallery-img">
            <img src="/images/photo2.jpg" alt="Inspiration 2" class="gallery-img">
            <img src="/images/photo3.jpg" alt="Inspiration 3" class="gallery-img">
            <img src="/images/photo4.png" alt="Inspiration 3" class="gallery-img">
            <img src="/images/photo5.png" alt="Inspiration 3" class="gallery-img">

            <!-- Add more <img> tags as needed -->
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <button class="prev-btn">&#10094;</button>
        <img id="lightbox-img" src="" alt="Full view">
        <button class="next-btn">&#10095;</button>
    </div>

    <script src="/gallery.js"></script>
    <script>
        document.documentElement.classList.add('loaded');
    </script>
</body>

</html>
